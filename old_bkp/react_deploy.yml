apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: react

  template:
    metadata:
      labels:
        app: react

    spec:
      containers:
      - name: react
        image: react-k8s:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 80
