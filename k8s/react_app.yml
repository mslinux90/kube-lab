apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-app
  namespace: react-dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: react

  template:
    metadata:
      labels:
        app: react

    spec:
      containers:
      - name: react
        image: mslinux90/react-k8s:3
        imagePullPolicy: Always
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: react-service
  namespace: react-dev

spec:
  selector:
    app: react

  type: NodePort

  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30000
