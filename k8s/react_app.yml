apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-app
  namespace: react-dev
  labels:
    app: react
    environment: dev
    project: kube-lab
    team: devops
  
  annotations:
    deployed-by: Jenkins
    managed-by: Ansible
    project: Kubernetes-Lab
    owner: Devops_team
    Manager: Manoj
    contact-email: devops@abc.com

spec:
  replicas: 2

  selector:
    matchLabels:
      app: react

  template:
    metadata:
      labels:
        app: react
        environment: dev
        project: kube-lab
        team: devops

    spec:
      containers:
      - name: react
        image: mslinux90/react-k8s:8
        imagePullPolicy: Always
 
        ports:
        - containerPort: 80
 
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"    

 
        readinessProbe:
          httpGet:
            path: /
            port: 80

        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 2
        successThreshold: 1
        failureThreshold: 3

---
apiVersion: v1
kind: Service

metadata:
  name: react-service
  namespace: react-dev
  labels:
    app: react
    environment: dev
    project: kube-lab
    team: devops

spec:
  selector:
    app: react

  type: NodePort

  ports:
  - protocol: TCP
    port: 80 
    targetPort: 80
    nodePort: 30000
